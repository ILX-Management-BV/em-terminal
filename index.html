// ===== HELPER FUNCTIONS =====
function chgColor(v){return v>0?'up-c':v<0?'dn-c':''}
function chgSign(v){return v>0?'+'+v.toFixed(2):v.toFixed(2)}
function bpsChg(v){return v>0?'+'+v.toFixed(1)+'bp':v.toFixed(1)+'bp'}
function fmtNum(v,d=2){if(typeof v==='string')return v;return v>=1000?v.toLocaleString('en',{minimumFractionDigits:d,maximumFractionDigits:d}):v.toFixed(d)}

function miniChart(data,dates,color,w=480,h=200){
if(!data||data.length<2)return'<svg width="'+w+'" height="'+h+'"></svg>';
const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
const pad={t:14,b:28,l:50,r:16};
const cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
const pts=data.map((v,i)=>{
const x=pad.l+(i/(data.length-1))*cw;
const y=pad.t+ch-(((v-mn)/rng)*ch);
return{x,y,v};
});
const line=pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
const area=line+' L'+pts[pts.length-1].x.toFixed(1)+','+(pad.t+ch)+' L'+pts[0].x.toFixed(1)+','+(pad.t+ch)+' Z';
// gridlines — 8 lines for finer resolution
const gridN=8;
let grids='';
for(let i=0;i<gridN;i++){
const y=pad.t+(i/(gridN-1))*ch;
const val=mx-((i/(gridN-1))*rng);
grids+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#1c2230" stroke-width="0.5"/>`;
grids+=`<text x="${pad.l-5}" y="${y+3}" text-anchor="end" font-size="9">${val>=1000?Math.round(val):val.toFixed(val<10?2:val<100?1:0)}</text>`;
}
// x labels — show ALL dates
let xlbls='';
if(dates){
const n=data.length;
pts.forEach((p,i)=>{
if(dates[i])xlbls+=`<text x="${p.x}" y="${h-5}" text-anchor="middle" font-size="8.5">${dates[i]}</text>`;
});
}
// vertical dotted line at conflict start (find "Feb 28" index)
let vline='';
if(dates){
const conflictIdx=dates.indexOf('Feb 28');
if(conflictIdx>=0){
const cx=pts[conflictIdx].x;
vline=`<line x1="${cx}" y1="${pad.t}" x2="${cx}" y2="${pad.t+ch}" stroke="#f6465d" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>`;
vline+=`<text x="${cx+3}" y="${pad.t+8}" font-size="7" fill="#f6465d" opacity="0.7">war</text>`;
}
}
// data point dots for each value
let dots='';
pts.forEach((p,i)=>{
if(i===pts.length-1) return;
dots+=`<circle cx="${p.x}" cy="${p.y}" r="2.2" fill="${color}" opacity="0.5"/>`;
});
const lastP=pts[pts.length-1];
return`<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
${grids}${xlbls}${vline}
<path d="${area}" fill="${color}" opacity="0.07"/>
<path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
${dots}
<circle cx="${lastP.x}" cy="${lastP.y}" r="3.5" fill="${color}"/>
</svg>`;
}

function cdsBarChart(items,w=480,h=260){
const valid=items.filter(x=>typeof x.val==='number').sort((a,b)=>b.val-a.val);
if(!valid.length)return'<p style="color:var(--txt3);padding:10px">No numeric CDS data available</p>';
const pad={t:10,b:30,l:90,r:30};
const cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
const barH=Math.min(22,ch/valid.length-2);
const mx=Math.max(...valid.map(x=>x.val));
// vertical gridlines
let grids='';
const gridSteps=[0,0.25,0.5,0.75,1.0];
gridSteps.forEach(frac=>{
const x=pad.l+frac*cw;
const val=Math.round(mx*frac);
grids+=`<line x1="${x}" y1="${pad.t-4}" x2="${x}" y2="${pad.t+valid.length*(barH+3)}" stroke="#1c2230" stroke-width="0.5"/>`;
grids+=`<text x="${x}" y="${pad.t+valid.length*(barH+3)+14}" text-anchor="middle" font-size="8" fill="#5e6673">${val}</text>`;
});
let bars='';
valid.forEach((item,i)=>{
const y=pad.t+i*(barH+3);
const bw=(item.val/mx)*cw;
const hue=Math.max(0,120-((item.val/700)*120));
const col=`hsl(${hue},70%,50%)`;
bars+=`<rect x="${pad.l}" y="${y}" width="${bw}" height="${barH}" fill="${col}" rx="2" opacity="0.85"/>`;
bars+=`<text x="${pad.l-4}" y="${y+barH/2+3}" text-anchor="end" font-size="10" fill="#848e9c">${item.c}</text>`;
bars+=`<text x="${pad.l+bw+4}" y="${y+barH/2+3}" font-size="10" font-weight="600" fill="#eaecef">${item.val}</text>`;
});
const totalH=pad.t+valid.length*(barH+3)+pad.b;
return`<svg width="100%" height="${totalH}" viewBox="0 0 ${w} ${totalH}" preserveAspectRatio="xMidYMid meet">${grids}${bars}</svg>`;
}

function renderNews(){
const cats=['ALL','MIL','SHIP','ENGY','MKT','DIPL','GEO'];
const catColors={MIL:'badge-red',SHIP:'badge-blue',ENGY:'badge-amber',MKT:'badge-green',DIPL:'badge-gray',GEO:'badge-red'};
let filterBar='<div class="filter-bar">';
cats.forEach(c=>{
filterBar+=`<div class="filter-btn ${c==='ALL'?'active':''}" onclick="filterNews('${c}')">${c}</div>`;
});
filterBar+='</div>';

let rows='<div class="scroll-area" id="newsScroll">';
D.news.forEach(n=>{
rows+=`<div class="news-row ${n.crit?'critical':''}" data-cat="${n.cat}">
<span class="news-time">${n.t}</span>
<span class="badge ${catColors[n.cat]||'badge-gray'}">${n.cat}</span>
<span class="news-hl">${n.hl}</span>
<span class="news-src">${n.src}</span>
</div>`;
});
rows+='</div>';
return filterBar+rows;
}
