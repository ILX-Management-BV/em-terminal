.pg{font-size:9px;color:var(--m);font-family:var(--mo)}

function ch(v,sfx){
  if(v==null)return'<span class="cf">-</span>';

  var c=n>0?"cu":n<0?"cd":"cf";var a=n>0?"\u25B2+":n<0?"\u25BC":"";
  return'<span class="'+c+'">'+a+Math.abs(n).toFixed(2)+(sfx||"")+'</span>';
}
function chBp(v){
  if(v==null)return'<span class="cf">-</span>';
  var n=parseFloat(v);if(isNaN(n))return'<span class="cf">'+v+'</span>';
  var c=n>0?"cd":n<0?"cu":"cf"; // wider=bad for credit
  var a=n>0?"\u25B2+":n<0?"\u25BC":"";
  return'<span class="'+c+'">'+a+Math.abs(n).toFixed(0)+'bp</span>';
}
function sp(data,col,w,h){
  if(!data||data.length<2)return'';w=w||72;h=h||20;
  var mn=Math.min.apply(null,data),mx=Math.max.apply(null,data),rng=mx-mn||1;
  var pts=data.map(function(v,i){return(i/(data.length-1))*w+","+((1-(v-mn)/rng)*h);}).join(" ");
  return'<svg width="'+w+'" height="'+h+'" style="display:block;flex-shrink:0"><polyline points="'+pts+'" fill="none" stroke="'+(col||"#00c087")+'" stroke-width="1.5" stroke-linejoin="round"/></svg>';
}

function bg(t,c){return'<span class="bg bg-'+c+'">'+t+'</span>';}
function mvBar(val,max,col){

// === INIT ===
function initTicker(){
  var el=document.getElementById("ticker");var html="";
  var items=ticks.concat(ticks);
  items.forEach(function(t){
    var neg=t.c.indexOf("-")===0;var isFlat=t.c==="flat";
    html+='<span><span style="color:var(--m);margin-right:3px;font-size:10px;font-family:var(--mo)">'+t.s+'</span><span style="color:var(--t);font-weight:600;margin-right:3px;font-size:10px;font-family:var(--mo)">'+t.v+'</span><span style="color:'+(isFlat?"var(--m)":neg?"var(--dn)":"var(--up)")+';font-weight:600;font-size:10px;font-family:var(--mo)">'+t.c+'</span></span>';
  });
  el.innerHTML=html;
}
function initNav(){
  var el=document.getElementById("nav");
  tabs.forEach(function(t){
    var btn=document.createElement("button");btn.textContent=t.label;btn.dataset.id=t.id;
    if(t.id===cur)btn.className="on";
    btn.addEventListener("click",function(){cur=t.id;render();document.querySelectorAll(".nv button").forEach(function(b){b.className=b.dataset.id===cur?"on":"";});});
    el.appendChild(btn);
  });
}
function render(){
  var el=document.getElementById("content");
  switch(cur){
    case"cds":el.innerHTML=renderCds();break;case"bonds":el.innerHTML=renderBonds();break;
    case"fx":el.innerHTML=renderFx();break;case"sharp":el.innerHTML=renderSharp();break;
    case"dm":el.innerHTML=renderDm();break;case"flows":el.innerHTML=renderFlows();break;
  }
}
function updateClock(){
  var d=new Date();var s=d.toISOString().slice(0,19).replace("T"," ")+" UTC";
  document.getElementById("clock").textContent=s;document.getElementById("cf").textContent=s;
}
initTicker();initNav();render();updateClock();setInterval(updateClock,1000);
</script>
