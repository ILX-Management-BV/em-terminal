function areaSVG(points,color,w=340,h=145){const pad=24,x0=pad,y0=14,x1=w-8,y1=h-24;const vals=points.map(p=>p[1]);const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;const X=i=>x0+i*(x1-x0)/Math.max(points.length-1,1),Y=v=>y1-(v-mn)*(y1-y0)/rg;let d='',a='';points.forEach((p,i)=>{d+=(i?'L':'M')+X(i)+','+Y(p[1]);a+=(i?'L':'M')+X(i)+','+Y(p[1])});a+=`L${x1},${y1}L${x0},${y1}Z`;let g='';for(let i=0;i<4;i++){const yy=y0+i*(y1-y0)/3,vl=(mx-(mx-mn)*i/3).toFixed(2);g+=`<line x1='${x0}' y1='${yy}' x2='${x1}' y2='${yy}' stroke='#25303f' stroke-width='1'/><text x='2' y='${yy+3}'>${vl}</text>`}let xl='';points.forEach((p,i)=>{xl+=`<text x='${X(i)}' y='${h-6}' text-anchor='middle'>${p[0]}</text>`});const lx=X(points.length-1),ly=Y(points.at(-1)[1]);return `<svg viewBox='0 0 ${w} ${h}' width='100%' height='150'>${g}<path d='${a}' fill='${color}' opacity='.07'/><path d='${d}' fill='none' stroke='${color}' stroke-width='1.5' stroke-linejoin='round'/><circle cx='${lx}' cy='${ly}' r='2.8' fill='${color}'/>${xl}</svg>`}
function barSVG(rows,w=520,h=220){const pad=24,vals=rows.map(r=>r[1]??0),mx=Math.max(520,...vals),x0=pad,y0=14,x1=w-8,y1=h-28,bw=(x1-x0)/rows.length*0.72;const col=v=>v>=500?'#f6465d':v>=300?'#ff6b5f':v>=200?'#f0b90b':v>=100?'#8dbf66':'#00c087';let g='';for(let i=0;i<5;i++){const y=y0+i*(y1-y0)/4,v=Math.round(mx*(1-i/4));g+=`<line x1='${x0}' y1='${y}' x2='${x1}' y2='${y}' stroke='#25303f'/><text x='2' y='${y+3}'>${v}</text>`}let b='';rows.forEach((r,i)=>{const x=x0+i*(x1-x0)/rows.length+4,v=r[1]??0,hh=(v/mx)*(y1-y0),y=y1-hh,n=r[0].slice(0,3).toUpperCase();if(r[1]==null){b+=`<text x='${x+bw/2}' y='${y1-4}' text-anchor='middle'>${n}</text><text x='${x+bw/2}' y='${y1-16}' text-anchor='middle' fill='#f0b90b'>N/A</text>`}else{b+=`<rect x='${x}' y='${y}' width='${bw}' height='${hh}' fill='${col(v)}'/><text x='${x+bw/2}' y='${y-3}' text-anchor='middle'>${v}</text><text x='${x+bw/2}' y='${y1-4}' text-anchor='middle'>${n}</text>`}});return `<svg viewBox='0 0 ${w} ${h}' width='100%' height='220'>${g}${b}</svg>`}
function ticker(){const t=[['BRN',D.commod[0].v,D.commod[0].d],['WTI',D.commod[1].v,D.commod[1].d],['XAU',D.commod[2].v,D.commod[2].d],['TTF',D.commod[3].v,D.commod[3].d],['VIX',D.bench.VIX.v,D.bench.VIX.d],['DXY',D.bench.DXY.v,D.bench.DXY.d],['EMBI+',D.bench.EMBI.v,'~estimated'],['CEMBI',D.bench.CEMBI.v,'~estimated'],['UST10',4.119,'+3.7bp'],['OVX',D.bench.OVX.v,D.bench.OVX.d],['EMB',D.bench.EMB.v,D.bench.EMB.d],['BTC',72547.82,13.22]];
const row=t.map(x=>`<span class='ti'><b>${x[0]}</b><span>${fmt(x[1])}</span><span class='${typeof x[2]==='number'?cls(x[2]):'warn'}'>${typeof x[2]==='number'?pct(x[2]):x[2]}</span></span>`).join('');
document.getElementById('ticker').innerHTML=row+row;}
function head(){document.getElementById('live').innerHTML=`<span>Brent: <b>${D.commod[0].v}</b></span><span>Gold: <b>${D.commod[2].v}</b></span><span>VIX: <b>${D.bench.VIX.v}</b></span><span>DXY: <b>${D.bench.DXY.v}</b></span><span>EMBI+ est: <b>${D.bench.EMBI.v}</b></span><span>CEMBI est: <b>${D.bench.CEMBI.v}</b></span><span>UST10Y: <b>4.119%</b></span><span>UTC <b id='clk'></b></span>`;setInterval(()=>document.getElementById('clk').textContent=new Date().toISOString().slice(11,19),1000)}
function tabbar(){const el=document.getElementById('tabs');el.innerHTML=TABS.map((t,i)=>`<div class='tab ${i===active?'active':''}' onclick='active=${i};render()'>${t}</div>`).join('')}
function mk(){const c=[['Brent',D.commod[0]],['WTI',D.commod[1]],['Gold',D.commod[2]],['TTF',D.commod[3]],['VIX',{...D.bench.VIX,f:D.bench.VIX.f}],['DXY',{...D.bench.DXY,f:D.bench.DXY.f}]];const cc=c.map(([n,x])=>`<div class='card'><div class='ch'>${n}<span class='ta-r mono' style='float:right'>${fmt(x.v)} <span class='${cls(x.d)}'>${pct(x.d)}</span></span></div><div class='cb'>${areaSVG(x.f,x.d>=0?'#f6465d':'#00c087')}<div class='small'>Source: ${x.src} | Time: ${epoch(x.ts)}</div></div></div>`).join('');
const rt=D.rates.map(r=>`<tr><td>${r.i}</td><td class='num'>${r.v}</td><td class='num'>${r.d}</td><td>${r.src}</td><td>${r.ts}</td></tr>`).join('');
const eq=D.eq.map(r=>`<tr><td>${r[0]}</td><td class='num'>${fmt(r[1])}</td><td class='num ${cls(r[2])}'>${pct(r[2])}</td><td>${r[3]}</td><td>${epoch(r[4])}</td></tr>`).join('');
const sh=D.safe.map(r=>`<tr><td>${r[0]}</td><td class='num'>${fmt(r[1])}</td><td class='num ${cls(r[2])}'>${pct(r[2])}</td><td>${r[3]}</td><td>${epoch(r[4])}</td></tr>`).join('');
const cal=D.calendar.map(r=>`<tr ${r[1]==='TBD'?'class="row-crit"':''}><td>${r[0]}</td><td class='num'>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
return `<div class='grid6'>${cc}</div><div class='grid2' style='margin-top:10px'><div class='card'><div class='ch'>Rates + DM Equities</div><div class='cb'><table><thead><tr><th>Instrument</th><th class='ta-r'>Level</th><th class='ta-r'>Chg</th><th>Source</th><th>Time</th></tr></thead><tbody>${rt}${eq}</tbody></table></div></div><div class='card'><div class='ch'>Safe Havens + Macro Calendar</div><div class='cb'><table><thead><tr><th>Asset</th><th class='ta-r'>Level</th><th class='ta-r'>Chg</th><th>Source</th><th>Time</th></tr></thead><tbody>${sh}</tbody></table><div style='height:8px'></div><table><thead><tr><th>Event</th><th class='ta-r'>Date</th><th>Source Note</th></tr></thead><tbody>${cal}</tbody></table></div></div></div>`}
function fx(){const ch=D.fx.map(x=>`<div class='card'><div class='ch'>${x.p}<span class='ta-r mono' style='float:right'>${fmt(x.s)} <span class='${cls(x.d)}'>${pct(x.d)}</span></span></div><div class='cb'>${areaSVG(x.h,x.d>=0?'#f0b90b':'#00c087',290,132)}<div class='small'>${x.h.length<3?'Limited historical data available. ':''}Source: ${x.src} | Time: ${epoch(x.ts)}</div></div></div>`).join('');
const tbl=D.fx.map(x=>`<tr><td>${x.p}</td><td class='num'>${fmt(x.s)}</td><td class='num ${cls(x.d)}'>${pct(x.d)}</td><td><span class='badge ${x.r.includes('peg')?'b-red':x.r.includes('managed')?'b-amb':'b-grn'}'>${x.r}</span></td><td>${x.src} (${epoch(x.ts)})</td></tr>`).join('');
return `<div class='grid12'>${ch}</div><div class='card' style='margin-top:10px'><div class='ch'>FX Data Table</div><div class='cb'><table><thead><tr><th>Pair</th><th class='ta-r'>Spot Rate</th><th class='ta-r'>Daily %</th><th>Regime</th><th>Data Source</th></tr></thead><tbody>${tbl}</tbody></table><div class='fxNote mono'>NDF/forward rates are NOT publicly available without Bloomberg terminal or equivalent licensed feed.</div></div></div>`}
function cred(){const top=D.risk.map(r=>{const m=D.cds.find(c=>c[0]===r.c);return [r.c,m?m[1]:null]});const full=[...D.cds].sort((a,b)=>(b[1]||-1)-(a[1]||-1));
const rr=D.risk.map(r=>`<tr><td>${r.c}</td><td>${r.rt}</td><td>${r.o}</td><td class='num'>${r.cds}</td></tr>`).join('');
const sp=[['EMBI+',D.bench.EMBI.v,'N/A','~estimated from EMB ETF proxy; JP Morgan licensed index'],['CEMBI',D.bench.CEMBI.v,'N/A','~estimated from EMB ETF proxy; JP Morgan licensed index'],['EMB ETF',D.bench.EMB.v,pct(D.bench.EMB.d),`Yahoo Finance spark (${epoch(D.bench.EMB.ts)})`],['CDX EM 5Y','N/A','N/A','Public real-time feed not found; Markit/Bloomberg license needed'],['iTraxx Crossover','N/A','N/A','Public real-time feed not found; Markit/Bloomberg license needed']]
.map(r=>`<tr><td>${r[0]}</td><td class='num'>${r[1]}</td><td class='num'>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
return `<div class='grid2'><div class='card'><div class='ch'>Top 10 Regional CDS (bps)</div><div class='cb'>${barSVG(top,520,220)}<div class='small'>Source: Damodaran country table (delayed, last updated 2026-01-05); not live executable CDS.</div></div><div class='ch'>Full Portfolio CDS (sorted)</div><div class='cb' style='overflow:auto'>${barSVG(full,Math.max(760,full.length*22),220)}<div class='small'>N/A entries show no public tradeable quote or missing sovereign CDS field.</div></div></div><div><div class='card'><div class='ch'>Credit Benchmarks</div><div class='cb'><table><thead><tr><th>Index</th><th class='ta-r'>Level</th><th class='ta-r'>Daily Chg</th><th>Data Availability Note</th></tr></thead><tbody>${sp}</tbody></table></div></div><div class='card' style='margin-top:10px'><div class='ch'>Risk Countries Ratings</div><div class='cb'><table><thead><tr><th>Country</th><th>Moody\'s</th><th>Outlook</th><th class='ta-r'>CDS 5Y (bps)</th></tr></thead><tbody>${rr}</tbody></table><div class='small'>Outlook is N/A where no free structured source was found during search window.</div></div></div></div></div>`}
function risk(){return `<div class='cards'>${D.risk.map((r,i)=>`<div class='cc'><div style='display:flex;justify-content:space-between;gap:8px;align-items:flex-start'><div><h3>${i+1}. ${r.c}</h3><div class='mono small'>CDS: ${r.cds} | FX: ${r.fx} | Moody\'s: ${r.rt} (${r.o})</div></div><div><span class='badge ${/EXTREME|HIGH/.test(r.pr)?'b-red':r.pr==='MEDIUM'?'b-amb':'b-grn'}'>PHYSICAL ${r.pr}</span> <span class='badge ${/EXTREME|HIGH/.test(r.fr)?'b-red':r.fr==='MEDIUM'?'b-amb':'b-grn'}'>FINANCIAL ${r.fr}</span></div></div><div class='channels'>${r.ch.map(c=>`<div class='tr ${c[1]}'><b>${c[0]}</b><div>${c[2]}</div></div>`).join('')}</div></div>`).join('')}</div>`}
function news(){const f=['ALL','MIL','SHIP','ENGY','MKT','DIPL','GEO'];const rows=D.news.filter(r=>newsFilter==='ALL'||r[1]===newsFilter).map(r=>`<tr class='${r[4]==='critical'?'row-crit':''}'><td class='mono'>${r[0]}</td><td><span class='badge ${r[1]==='MIL'?'b-red':r[1]==='SHIP'?'b-amb':r[1]==='ENGY'?'b-amb':r[1]==='MKT'?'b-blu':'b-grn'}'>${r[1]}</span></td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
return `<div class='card'><div class='ch'>Geopolitical Headlines (past 24h)</div><div class='filters'>${f.map(x=>`<button class='fbtn ${newsFilter===x?'on':''}' onclick='newsFilter="${x}";render()'>${x}</button>`).join('')}</div><div class='cb news'><table><thead><tr><th>Time (UTC approx)</th><th>Tag</th><th>Headline</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function footer(){document.getElementById('foot').innerHTML=`<div><b>Reference date:</b> ${D.refDate} | <b>Refresh timestamp:</b> ${D.refreshUTC}</div><div>Sources by category: Commodities/FX/Equities/BTC/EMB/MOVE/DXY via Yahoo Finance spark; VIX/OVX via Cboe; UST yields via CNBC/Tradeweb; Fed funds + FOMC dates via Federal Reserve; ECB dates via ECB schedule; Bund/BTP/Gilt via TradingEconomics; Sovereign CDS proxies via Damodaran (vintage 2026-01-05); Geopolitical headlines via Reuters.</div><div>Conflict resolution note: VIX conflict observed (Cboe 21.54 vs Yahoo 21.21); Cboe retained as higher-tier official index source. EMBI+ and CEMBI are proprietary benchmarks and shown as <span class='mono'>~estimated</span> placeholders only, not live index levels.</div><div>Not publicly available callouts: real-time EMBI+/CEMBI/CDX EM/iTraxx Xover levels and broad NDF forwards require licensed Bloomberg/Markit/J.P. Morgan data products.</div><div>Staleness disclosure: Damodaran CDS/default-spread dataset is delayed (academic/structural), not intraday.</div>`}
function render(){tabbar();document.getElementById('app').innerHTML=[mk,fx,cred,risk,news][active]();footer()}
ticker();head();render();
</script>
</body>
